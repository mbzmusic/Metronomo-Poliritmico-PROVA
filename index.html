<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metronomo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    
    <!-- Intestazione Sezione -->
    <div class="header-sequenza">
        <div class="titolo">
            SEQUENZA<br>BATTUTE
        </div>
        <div class="header-buttons">
            <button class="btn-secondary">Reset<br>Default</button>
            <button class="btn-secondary">Reset<br>accenti</button>
        </div>
    </div>

    <!-- BATTUTA 1 (Attiva) -->
    <div class="battuta-container active">
        <!-- Rigo 1: Parametri tutti sulla stessa riga -->
        <div class="battuta-parametri">
            <div class="indice-battuta active-badge">1</div>
            <select class="custom-select">
                <option>12/8</option>
                <option>4/4</option>
            </select>
            <select class="custom-select">
                <option>Terzine</option>
                <option>Ottavi</option>
            </select>
            <select class="custom-select">
                <option>x6</option>
                <option>x1</option>
            </select>
        </div>

        <!-- Rigo 2: Controlli centrati -->
        <div class="battuta-controlli">
            <button class="icon-btn">↑</button>
            <button class="icon-btn">↓</button>
            <button class="icon-btn">↻</button>
            <button class="icon-btn">⎘</button>
            <button class="icon-btn">✕</button>
        </div>
    </div>

    <!-- BATTUTA 2 -->
    <div class="battuta-container">
        <!-- Rigo 1: Parametri tutti sulla stessa riga -->
        <div class="battuta-parametri">
            <div class="indice-battuta inactive-badge">2</div>
            <select class="custom-select">
                <option>2/4</option>
                <option>4/4</option>
            </select>
            <select class="custom-select">
                <option>Quartine</option>
                <option>Ottavi</option>
            </select>
            <select class="custom-select">
                <option>x1</option>
                <option>x2</option>
            </select>
        </div>

        <!-- Rigo 2: Controlli centrati -->
        <div class="battuta-controlli">
            <button class="icon-btn">↑</button>
            <button class="icon-btn">↓</button>
            <button class="icon-btn">↻</button>
            <button class="icon-btn">⎘</button>
            <button class="icon-btn">✕</button>
        </div>
    </div>

    <!-- Pulsante Aggiungi Battuta -->
    <button class="btn-add-battuta">+ AGGIUNGI BATTUTA</button>

    <!-- Pulsante Avvia -->
    <button class="btn-avvia">AVVIA</button>

    <!-- SEZIONE TAP TEMPO (Aggiunta come richiesto) -->
    <div class="tap-tempo-wrapper">
        <button class="btn-tap-tempo">TAP TEMPO</button>
        <!-- -5 e +5 posizionati sulla destra -->
        <div class="tap-aggiustamenti">
            <button class="btn-step">-5</button>
            <button class="btn-step">+5</button>
        </div>
    </div>

    <div class="footer-text">
        SPAZIO: AVVIO/STOP • ↑ ↓ TEMPO (SHIFT = ±5)
    </div>

</div>

</body>
</html>
