<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronomo & Allenatore di Ritmo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header & Main Controls -->
        <header class="app-header">
            <div class="brand">
                <div class="logo-icon">♩</div>
                <h1>RhythmPulse <span class="badge">Pro</span></h1>
            </div>
            
            <div class="view-toggle-container">
                <span class="toggle-label">Vista:</span>
                <div class="toggle-switch">
                    <button id="viewDotsBtn" class="toggle-btn active" data-view="dots">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="6" cy="12" r="3"/><circle cx="12" cy="12" r="3"/><circle cx="18" cy="12" r="3"/>
                        </svg>
                        Pallini
                    </button>
                    <button id="viewNotationBtn" class="toggle-btn" data-view="notation">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                        </svg>
                        Notazione
                    </button>
                </div>
            </div>
        </header>

        <!-- Primary Playback & Tempo Panel -->
        <section class="control-card">
            <div class="main-play-section">
                <button id="playBtn" class="btn-play" aria-label="Avvia o Ferma Metronomo">
                    <span class="play-icon">▶</span>
                    <span class="play-text">AVVIA</span>
                </button>
                <button id="tapTempoBtn" class="btn-secondary tap-btn">TAP TEMPO</button>
            </div>

            <div class="tempo-section">
                <div class="tempo-display-wrapper">
                    <button id="tempoMinus" class="btn-circle">-</button>
                    <div class="tempo-readout">
                        <input type="number" id="bpmInput" value="120" min="30" max="300">
                        <span class="bpm-label">BPM</span>
                    </div>
                    <button id="tempoPlus" class="btn-circle">+</button>
                </div>
                <input type="range" id="bpmSlider" min="30" max="300" value="120" class="tempo-slider">
                <div class="tempo-presets">
                    <button class="preset-btn" data-bpm="60">Largo (60)</button>
                    <button class="preset-btn" data-bpm="90">Andante (90)</button>
                    <button class="preset-btn active" data-bpm="120">Moderato (120)</button>
                    <button class="preset-btn" data-bpm="140">Allegro (140)</button>
                    <button class="preset-btn" data-bpm="170">Presto (170)</button>
                </div>
            </div>

            <div class="settings-grid">
                <div class="setting-item">
                    <label for="timeSigSelect">Tempo (In chiave)</label>
                    <select id="timeSigSelect" class="custom-select">
                        <option value="2">2/4</option>
                        <option value="3">3/4</option>
                        <option value="4" selected>4/4</option>
                        <option value="5">5/4</option>
                        <option value="6">6/8</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="volumeSlider">Volume</label>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" class="volume-slider">
                </div>
                <div class="setting-item">
                    <label for="soundSelect">Timbro Audio</label>
                    <select id="soundSelect" class="custom-select">
                        <option value="digital">Digitale Beep</option>
                        <option value="woodblock">Woodblock</option>
                        <option value="cowbell">Campana</option>
                        <option value="click">Click di Studio</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Rhythm Grid Display Section -->
        <section class="rhythm-display-card">
            <div class="section-title">
                <h2>Struttura della Misura</h2>
                <p class="subtitle">Clicca sul numero del beat per cambiare la suddivisione</p>
            </div>

            <!-- Unified Grid Container with strict visual parity -->
            <div id="measureGrid" class="measure-grid view-dots">
                <!-- Dynamic Content Rendered Here by JS -->
            </div>
        </section>

        <!-- Global Popup for Subdivision Selection -->
        <div id="subdivisionPopup" class="subdivision-popup hidden" tabindex="-1">
            <div class="popup-header">Seleziona Suddivisione</div>
            <div class="popup-options">
                <button class="sub-option" data-sub="1">
                    <span class="sub-icon">♩</span>
                    <span class="sub-name">1 - Semiminima</span>
                </button>
                <button class="sub-option" data-sub="2">
                    <span class="sub-icon">♫</span>
                    <span class="sub-name">2 - Crome (1/8)</span>
                </button>
                <button class="sub-option" data-sub="3">
                    <span class="sub-icon">𝄾3</span>
                    <span class="sub-name">3 - Terzina (1/8t)</span>
                </button>
                <button class="sub-option" data-sub="4">
                    <span class="sub-icon">♬</span>
                    <span class="sub-name">4 - Sedicesimi (1/16)</span>
                </button>
                <button class="sub-option" data-sub="5">
                    <span class="sub-icon">5</span>
                    <span class="sub-name">5 - Quintina</span>
                </button>
                <button class="sub-option" data-sub="6">
                    <span class="sub-icon">6</span>
                    <span class="sub-name">6 - Sestina</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
