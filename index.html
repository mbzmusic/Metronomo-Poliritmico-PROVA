<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il tuo Sito</title>
    <style>
        /* Stili generali della pagina */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        /* --- GRIGLIA QUARTINE (DESKTOP: 4 IN RIGA / SMARTPHONE: 2X2) --- */
        .contenitore-quartine {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 colonne affiancate su desktop */
            gap: 20px; /* Spazio tra gli elementi */
        }

        .quartina {
            background-color: #ffffff;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .quartina h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .quartina p {
            margin-bottom: 0;
            line-height: 1.5;
            color: #555;
        }

        /* Regola specifica per Smartphone: schermi fino a 768px */
        @media (max-width: 768px) {
            .contenitore-quartine {
                grid-template-columns: repeat(2, 1fr); /* Forza esattamente 2 colonne per rigo (2x2) */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Titolo del Sito</h1>
    </header>

    <main>
        <h2>Le tue Quartine</h2>
        
        <div class="contenitore-quartine">
            <div class="quartina">
                <h3>Quartina 1</h3>
                <p>Testo della prima quartina inserito qui...</p>
            </div>
            <div class="quartina">
                <h3>Quartina 2</h3>
                <p>Testo della seconda quartina inserito qui...</p>
            </div>
            <div class="quartina">
                <h3>Quartina 3</h3>
                <p>Testo della terza quartina inserito qui...</p>
            </div>
            <div class="quartina">
                <h3>Quartina 4</h3>
                <p>Testo della quarta quartina inserito qui...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Tutti i diritti riservati</p>
    </footer>

</body>
</html>
